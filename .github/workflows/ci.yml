# CI do editor: as suites Noxy no Ubuntu e no Windows. Os smokes de navegador
# (Chrome e WebKitGTK) ficam fora: precisam de janela e de navegador
# instalados. No Windows o terminal nao abre (a noxy_pty recusa) e as suites
# conferem a recusa em vez do shell.
name: CI

on:
  push:
  pull_request:

jobs:
  noxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install github.com/estevaofon/noxy/cmd/noxy@v0.26.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: noxy --sync --locked
      - run: noxy tests/run.nx
      - run: noxy tests/protocol.nx

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install github.com/estevaofon/noxy/cmd/noxy@v0.26.0
      - run: Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - run: noxy --sync --locked
      - run: noxy tests/run.nx
      - run: noxy tests/protocol.nx
